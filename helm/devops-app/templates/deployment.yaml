apiVersion: apps/v1

kind: Deployment

metadata:
  name: devops-app

spec:

  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: devops-app

  template:

    metadata:
      labels:
        app: devops-app

    spec:

      containers:

        - name: devops-app

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.targetPort }}

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"
